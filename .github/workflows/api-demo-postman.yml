name: API Demo — Jest + Postman (Newman)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    env:
      NODE_ENV: development
      ENABLE_DEMO_LOGIN: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      BASE_URL: http://localhost:3000
      PGSSL: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: DB migrate
        run: npm run db:migrate

      - name: DB seed (demo user/workspace/docs)
        run: npm run db:seed

      - name: Run Jest tests
        run: npm run test:ci

      - name: Start API server
        run: |
          npm start &
          echo $! > server.pid

      - name: Wait for /health
        run: |
          for i in {1..60}; do
            if curl -sSf ${BASE_URL}/health > /dev/null; then echo "API ready"; break; fi
            echo "Waiting for API..."; sleep 2;
          done

      - name: Run Newman
        run: npm run postman:test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) || true; fi